version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gst_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: gst_filing_db
      POSTGRES_USER: gst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gst_secure_prod_pass}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst -d gst_filing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gst_redis_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: gst_minio_prod
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GST_MINIO_ROOT_USER:-gst_admin}
      MINIO_ROOT_PASSWORD: ${GST_MINIO_ROOT_PASSWORD:-gst_minio_secure_pass}
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gst_backend_prod
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://gst:${POSTGRES_PASSWORD:-gst_secure_prod_pass}@postgres:5432/gst_filing_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_USER=${GST_MINIO_ROOT_USER:-gst_admin}
      - MINIO_PASSWORD=${GST_MINIO_ROOT_PASSWORD:-gst_minio_secure_pass}
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gst_frontend_prod
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8084
    ports:
      - "127.0.0.1:9094:3000"
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
  minio_data:
