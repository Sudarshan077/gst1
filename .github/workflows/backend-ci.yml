name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps (uv, pyproject only — never pip at runtime)
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy .


      - name: Pytest
        run: uv run pytest -v

  extraction-gates:
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --dev
      - name: Run extraction gates
        run: uv run python ../scripts/measure_extraction.py --ground-truth ../extraction/golden_set/ground_truth --predictions ../extraction/golden_set/predictions
