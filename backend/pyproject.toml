[project]
name = "gst-filing-backend"
version = "0.1.0"
description = "GST Filing Platform backend — FastAPI + SQLAlchemy 2 + Alembic"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=5.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "minio>=7.2.20",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pymupdf>=1.28.2",
    "pyotp>=2.9",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psycopg2",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests; S101 blocks everywhere else

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"app/**/tests/**" = ["S101"]
# Alembic revisions are largely machine-generated (long sa.Column lines) and are
# historical records once applied: never reflow them by hand to satisfy lint.
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "I001", "W291"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
explicit_package_bases = true
mypy_path = "."
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
